name: Build Lune iOS Release

on:
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test mode (uploads the artifact only, without creating a GitHub release)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Lune/Resources/Info.plist 2>/dev/null || echo "1.5.5")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Lune version: $VERSION"

      - name: Build and Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Lune.xcodeproj \
            -scheme Lune \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Lune.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Lune.xcarchive/Products/Applications/Lune.app build/Payload/
          cd build
          zip -qr "Lune-${{ steps.version.outputs.version }}.ipa" Payload
          ls -la "Lune-${{ steps.version.outputs.version }}.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lune-${{ steps.version.outputs.version }}-iOS-IPA
          path: build/*.ipa

      - name: Create Github Release
        if: ${{ !inputs.test_build }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Lune ${{ steps.version.outputs.version }} (iOS)
          files: build/*.ipa
